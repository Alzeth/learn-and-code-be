name: Backend CI 🧪

on:
  push:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm ci
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: true

      - name: Generate Prisma client 🗄️
        run: npx prisma generate

      - name: Lint 🔍
        run: npm run lint

      - name: Run unit tests 🧪
        run: npm run test

      - name: Run e2e tests 🧪
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db

      - name: Build 📥
        run: npm run build
