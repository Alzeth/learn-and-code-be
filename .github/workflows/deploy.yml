name: Deploy to Railway 🚀

on:
  workflow_run:
    workflows: ["Backend CI 🧪"]
    types: [completed]
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Create GitHub deployment 📌
        id: deployment
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments" \
            -d "{\"ref\":\"${GITHUB_SHA}\",\"environment\":\"production\",\"auto_merge\":false,\"required_contexts\":[]}")
          echo "id=$(echo "$response" | jq -r '.id')" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Railway 🚀
        run: |
          npm install -g @railway/cli
          railway up --service "learn-and-code-be" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Update deployment status ✅
        if: always()
        run: |
          state=$([ "$JOB_STATUS" = "success" ] && echo "success" || echo "failure")
          curl -s -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${{ steps.deployment.outputs.id }}/statuses" \
            -d "{\"state\":\"$state\",\"environment\":\"production\"}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
